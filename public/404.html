<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>404: Halaman Tidak Ditemukan · Rafif Sava Adyvka Pratama</title>
    <meta name="description" content="Halaman yang Anda tuju tidak ditemukan di portofolio resmi Rafif Sava Adyvka Pratama." />
    <meta name="robots" content="noindex, nofollow" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <style>
      *, *::before, *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        background-color: #070708;
        color: #ededf0;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 1.5rem;
        position: relative;
        overflow: hidden;
      }
      .glow {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        width: 480px;
        height: 480px;
        background: radial-gradient(circle, rgba(124, 242, 255, 0.08) 0%, rgba(7, 7, 8, 0) 70%);
        pointer-events: none;
        z-index: 0;
      }
      .card {
        position: relative;
        z-index: 1;
        max-width: 520px;
        width: 100%;
        background: rgba(13, 13, 16, 0.85);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 20px;
        padding: 3rem 2.25rem;
        text-align: center;
        box-shadow: 0 25px 60px rgba(0, 0, 0, 0.6), 0 0 1px rgba(124, 242, 255, 0.2);
      }
      .tag {
        display: inline-block;
        font-family: "Geist Mono", ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        font-size: 0.75rem;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: #7cf2ff;
        background: rgba(124, 242, 255, 0.08);
        border: 1px solid rgba(124, 242, 255, 0.2);
        padding: 0.35rem 0.85rem;
        border-radius: 9999px;
        margin-bottom: 1.5rem;
      }
      h1 {
        font-size: 2.25rem;
        font-weight: 500;
        line-height: 1.2;
        color: #ffffff;
        margin-bottom: 1rem;
        letter-spacing: -0.02em;
      }
      h1 em {
        font-style: italic;
        font-family: Georgia, "Times New Roman", serif;
        color: #7cf2ff;
      }
      p {
        font-size: 0.95rem;
        line-height: 1.65;
        color: rgba(237, 237, 240, 0.65);
        margin-bottom: 2.25rem;
      }
      .btn-group {
        display: flex;
        flex-direction: column;
        gap: 0.75rem;
      }
      @media (min-width: 480px) {
        .btn-group {
          flex-direction: row;
          justify-content: center;
        }
      }
      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        font-size: 0.875rem;
        font-weight: 500;
        text-decoration: none;
        padding: 0.85rem 1.6rem;
        border-radius: 9999px;
        transition: all 0.2s ease;
      }
      .btn-primary {
        background: #ffffff;
        color: #070708;
      }
      .btn-primary:hover {
        background: #ededf0;
        transform: translateY(-1px);
        box-shadow: 0 10px 25px rgba(255, 255, 255, 0.15);
      }
      .btn-secondary {
        background: rgba(255, 255, 255, 0.04);
        color: #ededf0;
        border: 1px solid rgba(255, 255, 255, 0.1);
      }
      .btn-secondary:hover {
        background: rgba(255, 255, 255, 0.08);
        border-color: rgba(255, 255, 255, 0.2);
        color: #ffffff;
      }
      .brand-footnote {
        margin-top: 2.5rem;
        font-size: 0.8rem;
        color: rgba(237, 237, 240, 0.35);
      }
    </style>
  </head>
  <body>
    <div class="glow" aria-hidden="true"></div>
    <main class="card">
      <span class="tag">// HTTP 404 NOT FOUND</span>
      <h1>Rute ini <em>tersesat</em>.</h1>
      <p>
        Halaman atau rute yang Anda tuju tidak ditemukan atau mungkin sudah dipindahkan.
        Navigasi utama dan portofolio tetap aktif normal.
      </p>
      <div class="btn-group">
        <a href="/" class="btn btn-primary">Kembali ke Beranda</a>
        <a href="/projects" class="btn btn-secondary">Lihat Proyek</a>
      </div>
      <div class="brand-footnote">
        Rafif Sava Adyvka Pratama · Portfolio
      </div>
    </main>
  </body>
</html>
